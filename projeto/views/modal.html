<!-- Modal -->

<div id="modal" class="hide">
    <div class="content">

        <h1> Nova Ideia</h1>

        <form action="/" method="POST">

            <div class="input-wrapper">
                <label for="idea-title">Título da ideia</label>
                <input type="text" id="idea-title" name="title" required>
            </div>

            <div class="input-wrapper">
                <label for="idea-category">Categoria</label>
                <input type="text" id="idea-category" name="category" required>

            </div>

            <div class="input-wrapper">
                <label for="idea-image">Link da Imagem</label>
                <input type="url" id="idea-image" name="image" required>

            </div>

            <div class="input-wrapper">
                <label for="idea-description">Digite uma descrição para essa ideia</label>
                <textarea id="idea-description" name="description" required cols="30" rows="10"></textarea>

            </div>

            <div class="input-wrapper">
                <label for="idea-link">Link da Ideia</label>
                <input type="url" id="idea-link" name="link" required>

            </div>

            <a href="#" onclick="onOff()">Voltar</a>
            <button>Salvar</button>


        </form>


    </div>

</div>
