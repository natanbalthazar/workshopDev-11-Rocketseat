# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Sem `target-branch`, os PRs vão para a branch padrão (master).

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/projeto" # Localização do package.json
    schedule:
      interval: "weekly"

  # Mantém atualizadas as actions usadas em .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
